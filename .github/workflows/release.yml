name: Release APK

on:
  push:
    tags:
      - 'v*'

# Needed so the job can create a Release and upload the APK to it.
permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest

    env:
      # Empty unless the repo has signing secrets configured, which is what the
      # steps below branch on. Secrets cannot be read in `if:` directly, so they
      # are lifted into the environment first.
      KEYSTORE_BASE64: ${{ secrets.KEYSTORE_BASE64 }}

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '21'

      - name: Drop the local JDK pin
        run: sed -i '/^org.gradle.java.home=/d' gradle.properties

      - uses: android-actions/setup-android@v3
        with:
          packages: ''

      - uses: gradle/actions/setup-gradle@v4

      # ---- signed path: only when a keystore has been configured ----

      - name: Decode keystore
        if: env.KEYSTORE_BASE64 != ''
        run: echo "$KEYSTORE_BASE64" | base64 -d > "$RUNNER_TEMP/keystore.jks"

      - name: Build release APK
        if: env.KEYSTORE_BASE64 != ''
        run: ./gradlew assembleRelease

      - name: Sign release APK
        if: env.KEYSTORE_BASE64 != ''
        env:
          KEYSTORE_PASSWORD: ${{ secrets.KEYSTORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.KEY_ALIAS }}
          KEY_PASSWORD: ${{ secrets.KEY_PASSWORD }}
        run: |
          set -euo pipefail
          BUILD_TOOLS="$(find "$ANDROID_HOME/build-tools" -maxdepth 1 -mindepth 1 -type d | sort -V | tail -1)"
          "$BUILD_TOOLS/zipalign" -p -f 4 \
            app/build/outputs/apk/release/app-release-unsigned.apk \
            "$RUNNER_TEMP/aligned.apk"
          "$BUILD_TOOLS/apksigner" sign \
            --ks "$RUNNER_TEMP/keystore.jks" \
            --ks-pass "env:KEYSTORE_PASSWORD" \
            --ks-key-alias "$KEY_ALIAS" \
            --key-pass "env:KEY_PASSWORD" \
            --out "applock-${GITHUB_REF_NAME}.apk" \
            "$RUNNER_TEMP/aligned.apk"
          "$BUILD_TOOLS/apksigner" verify --print-certs "applock-${GITHUB_REF_NAME}.apk"

      # ---- unsigned path: no keystore configured, ship the debug build ----

      - name: Build debug APK
        if: env.KEYSTORE_BASE64 == ''
        run: |
          ./gradlew assembleDebug
          cp app/build/outputs/apk/debug/app-debug.apk "applock-${GITHUB_REF_NAME}-debug.apk"

      - name: Publish release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          if [ -n "$KEYSTORE_BASE64" ]; then
            NOTES="Signed release build. Install with \`adb install -r applock-${GITHUB_REF_NAME}.apk\`."
          else
            NOTES=$'This is a **debug-signed** build, because no signing keystore is configured for this repository.\n\nIt installs and runs fine for sideloading, but it is debuggable and cannot be upgraded in place by a future signed release. See the README for how to add a keystore.'
          fi
          gh release create "$GITHUB_REF_NAME" \
            --title "$GITHUB_REF_NAME" \
            --notes "$NOTES" \
            --generate-notes \
            applock-*.apk
