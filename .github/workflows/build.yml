name: Build APK

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      # AGP does not run on JDK 26; gradle.properties pins a local JDK 21 path
      # that will not exist on the runner, so it is stripped here and JAVA_HOME
      # from this step is used instead.
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '21'

      - name: Drop the local JDK pin
        run: sed -i '/^org.gradle.java.home=/d' gradle.properties

      # packages: '' because the action otherwise installs the legacy `tools`
      # package, which no longer exists in the SDK repository and fails the job.
      # The runner image already ships the platform and build-tools we need.
      - uses: android-actions/setup-android@v3
        with:
          packages: ''

      - uses: gradle/actions/setup-gradle@v4

      - name: Lint
        run: ./gradlew lintDebug

      - name: Build debug APK
        run: ./gradlew assembleDebug

      - uses: actions/upload-artifact@v4
        with:
          name: app-debug
          path: app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error

      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: lint-report
          path: app/build/reports/lint-results-debug.html
          if-no-files-found: ignore
